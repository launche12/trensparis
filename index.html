  <script>
    (()=>{
      const d=JSON.parse(document.getElementById('monitor-data').textContent);
      const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const eur=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'EUR'}).format(n);
      const dt=s=>new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'medium',timeZone:d.timezone}).format(new Date(s));
      document.getElementById('updated').innerHTML=`Atualizado em<br><strong>${esc(dt(d.updatedAt))}</strong><br><span>${esc(d.timezone)}</span>`;
      const cov=d.historyCoverage||{};
      document.getElementById('coverage').textContent=`Histórico importado das imagens fornecidas: ${cov.importedFromDate||'—'} a ${cov.importedThroughDate||'—'}. ${cov.note||''}`;
      const alerts=document.getElementById('alerts');
      (d.alerts||[]).slice().reverse().forEach(a=>{
        const route=d.routes[a.routeId]; if(!route)return;
        const box=document.createElement('div');box.className='alert '+(a.changePercent<0?'down':'');
        box.innerHTML=`<strong>${esc(route.label)}: ${a.changePercent>0?'alta':'queda'} de ${Math.abs(a.changePercent).toFixed(1)}%</strong> · ${eur(a.previousPrice)} → ${eur(a.currentPrice)} · ${esc(dt(a.checkedAt))}`;
        alerts.appendChild(box);
      });
      const chartSvg=(entries,id)=>{
        const W=760,H=205,L=54,R=15,T=12,B=30, iw=W-L-R, ih=H-T-B;
        const arr=[...entries].sort((a,b)=>a.date.localeCompare(b.date));
        if(!arr.length)return `<svg class="chart" viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle" class="chart-empty">Sem histórico</text></svg>`;
        const vals=arr.map(x=>Number(x.price)), lo=Math.min(...vals), hi=Math.max(...vals), pad=hi===lo?Math.max(1,lo*.04):(hi-lo)*.12;
        const y0=lo-pad,y1=hi+pad, minDay=Date.parse(arr[0].date+'T00:00:00Z'),maxDay=Date.parse(arr[arr.length-1].date+'T00:00:00Z'),span=Math.max(1,maxDay-minDay);
        const x=v=>L+(Date.parse(v.date+'T00:00:00Z')-minDay)/span*iw, y=v=>T+(y1-Number(v.price))/(y1-y0)*ih;
        let s='';
        for(let i=0;i<4;i++){const yy=T+ih*i/3, val=y1-(y1-y0)*i/3;s+=`<line class="gridline" x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}"/><text class="axis" x="${L-7}" y="${yy+4}" text-anchor="end">${Math.round(val)}</text>`}
        let seg=[];
        const flush=()=>{if(seg.length>1)s+=`<polyline class="trend" points="${seg.map(v=>`${x(v)},${y(v)}`).join(' ')}"/>`;seg=[]};
        for(let i=0;i<arr.length;i++){
          if(i&&((Date.parse(arr[i].date+'T00:00:00Z')-Date.parse(arr[i-1].date+'T00:00:00Z'))/86400000)>1){flush()}
          seg.push(arr[i]);
        }flush();
        for(let i=0;i<arr.length;i++){
          const p=arr[i],cx=x(p),cy=y(p);s+=`<circle class="dot" cx="${cx}" cy="${cy}" r="4"><title>${esc(p.date)} · ${eur(p.price)}</title></circle>`;
        }
        const first=arr[0].date,last=arr[arr.length-1].date;
        s+=`<text class="axis" x="${L}" y="${H-7}">${esc(first)}</text><text class="axis" x="${W-R}" y="${H-7}" text-anchor="end">${esc(last)}</text>`;
        return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Histórico de preços de ${esc(id)}">${s}</svg>`;
      };
      const routeCard=r=>{
        const c=r.current||{}, entries=r.entries||[];
        const opts=(c.options||[]).map(o=>`<div class="option"><strong>${eur(o.price)} · ${esc(o.fareClass)}</strong><span>${esc(o.departure)} → ${esc(o.arrival)} · ${esc(o.operator)}</span></div>`).join('');
        const rows=[...entries].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<tr><td>${esc(x.date)}</td><td class="num">${eur(x.price)}</td><td>${esc(x.departure)}</td><td>${esc(x.arrival)}</td><td>${esc(x.fareClass)}</td><td>${esc(x.operator)}</td><td>${esc(dt(x.checkedAt))}</td></tr>`).join('');
        return `<article class="route">
          <div class="route-head"><div><h2>${esc(r.origin||'Paris')} → ${esc(r.destination||r.label)}</h2><small>Menor preço válido registrado por dia</small></div><span class="tag">${entries.length} registros</span></div>
          <div class="price-row"><div><div class="price">${c.price==null?'—':eur(c.price)}</div><div class="fare">${c.price==null?'Aguardando primeira consulta válida':`${esc(c.fareClass||'')} · consulta ${esc(dt(c.checkedAt))}`}</div></div><div class="trip-time"><span>${c.departure?`${esc(c.departure)} → ${esc(c.arrival||'—')}`:'—'}</span><small>${esc(c.operator||'')}</small></div></div>
          <div class="chart-wrap"><div class="chart-title">Preço mínimo por dia de consulta · lacunas sem dados permanecem em branco</div>${chartSvg(entries,r.label)}</div>
          <div class="options"><h3>Opções válidas da consulta mais recente</h3><div class="option-list">${opts||'<span class="source">Nenhuma opção com preço nesta consulta.</span>'}</div>${(c.excludedOptions||[]).map(x=>`<div class="source">Excluída: ${esc(x.departureDate)} ${esc(x.departure)} · ${eur(x.price)} — ${esc(x.reason)}</div>`).join('')}</div>
          <div class="history"><h3>Histórico diário</h3><div class="table-wrap"><table><thead><tr><th>Dia da consulta</th><th class="num">Menor preço</th><th>Partida</th><th>Chegada</th><th>Classe</th><th>Operadora</th><th>Última consulta (Brasília)</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="source">Ainda sem consulta válida.</td></tr>'}</tbody></table></div></div>
        </article>`;
      };
      document.getElementById('routes').innerHTML=Object.values(d.routes).map(routeCard).join('');
      window.setTimeout(()=>window.location.reload(),60000);
    })();
  </script>
